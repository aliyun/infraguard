name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run tests
        run: make test

      - name: Run policy tests
        run: make test-policy

      - name: Check Go coverage
        if: matrix.os == 'ubuntu-latest'
        run: make test-coverage

      - name: Generate main coverage XML
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && hashFiles('reports/coverage.out') != '' }}
        run: |
          # Resolve standalone scripts without dropping their build-ignored files.
          sed -e "s|$(go list -m)/||g" -e "s|$PWD/||g" reports/coverage.out > reports/coverage-relative.out
          go run github.com/t-yuki/gocover-cobertura@aaee18c8195c3f2d90e5ef80ca918d265463842a < reports/coverage-relative.out > reports/coverage.xml
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          profile = pathlib.Path('reports/coverage-relative.out').read_text().splitlines()[1:]
          expected = {line.rsplit(':', 1)[0] for line in profile}
          root = ET.parse('reports/coverage.xml').getroot()
          actual = {item.attrib['filename'] for item in root.findall('.//class')}
          assert expected and actual == expected, f'Coverage file mismatch: {expected ^ actual}'
          PY

      - name: Save main coverage report
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && hashFiles('reports/coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ut-coverage-main
          path: reports/coverage.xml
          if-no-files-found: error

      - name: Save total coverage report
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && hashFiles('reports/coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ut-coverage
          path: reports/coverage.xml
          if-no-files-found: error

      - name: Upload main coverage to Codecov
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && hashFiles('reports/coverage.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: aliyun/infraguard
          files: reports/coverage.xml
          flags: main
          disable_search: true
          fail_ci_if_error: true

  check:
    name: Check Generated Files, Lint and Validate Translations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Check index_gen.go is up to date
        run: |
          # Regenerate the index file and format it
          go run cmd/policy-gen/main.go
          go fmt pkg/policy/index_gen.go
          
          # Check if there are any differences
          if ! git diff --exit-code pkg/policy/index_gen.go; then
            echo ""
            echo "ERROR: pkg/policy/index_gen.go is out of date!"
            echo ""
            echo "Please run 'make gen-policy' and commit the changes."
            exit 1
          fi
          
          echo "✓ pkg/policy/index_gen.go is up to date"

      - name: Run go vet
        run: make lint

      - name: Validate translations
        run: make validate-translations
